# Copy this file to secrets.yaml (same folder) and fill in your own values.
# secrets.yaml is ignored by git; never commit it.

# Generate your own key: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_YOUR_OWN_BASE64_KEY"
ota_password: "choose-a-strong-password"

# Optional second Home Assistant site (Settings → Home Assistant). Each site has its own API key,
# so only the selected site's Home Assistant can connect; add the display to that Home Assistant
# with that site's key. Leave the site 2 key empty ("") for one site. The names must differ.
site_1_name: "Home"
site_2_name: "Site 2"
api_encryption_key_site_2: ""

# Up to three Wi-Fi networks. The SSIDs are also shown on the Wi-Fi preset buttons in Settings.
wifi_ssid_1: "YourWiFi"
wifi_password_1: "YourPassword"
wifi_ssid_2: "SecondWiFi"
wifi_password_2: "SecondPassword"
wifi_ssid_3: "ThirdWiFi"
wifi_password_3: "ThirdPassword"
